<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股個股分析儀表板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 15px;
            color: #fff;
        }
        
        .container { max-width: 1400px; margin: 0 auto; }
        
        h1 {
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.8rem;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* 狀態列 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .market-info { display: flex; gap: 20px; align-items: center; }
        .market-item { font-size: 0.95rem; }
        .market-value { font-weight: bold; color: #00ff88; }
        .market-value.down { color: #ff4757; }
        
        .update-info { font-size: 0.8rem; color: #888; }
        
        .btn-group { display: flex; gap: 8px; }
        
        .refresh-btn {
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            border: none;
            color: #1a1a2e;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }
        
        .refresh-btn:hover { transform: scale(1.05); }
        
        .update-btn {
            background: linear-gradient(135deg, #ff6b6b, #ffa500);
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 107, 107, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0); }
        }
        
        /* 搜尋 */
        .search-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 8px 20px;
            border: 2px solid rgba(0, 217, 255, 0.3);
            width: 100%;
            max-width: 350px;
        }
        
        .search-box:focus-within { border-color: #00d9ff; box-shadow: 0 0 15px rgba(0, 217, 255, 0.3); }
        .search-box input { 
            background: transparent; 
            border: none; 
            color: #fff; 
            font-size: 1rem; 
            width: 100%; 
            padding: 6px; 
            outline: none; 
        }
        
        .search-btn {
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            border: none;
            color: #1a1a2e;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }
        
        /* 快速選擇 */
        .quick-stocks {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 15px;
        }
        
        .quick-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s;
        }
        
        .quick-btn:hover, .quick-btn.active { 
            background: rgba(0, 217, 255, 0.3); 
            border-color: #00d9ff; 
        }
        
        /* 股票網格 */
        .stock-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
        }
        
        .stock-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s;
        }
        
        .stock-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 217, 255, 0.15);
        }
        
        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        .stock-info { display: flex; align-items: baseline; gap: 12px; }
        .stock-code { font-size: 1.8rem; font-weight: bold; color: #00d9ff; }
        .stock-name { font-size: 1.1rem; color: #bbb; }
        .sector-tag { 
            font-size: 0.75rem; 
            padding: 4px 10px; 
            background: rgba(0, 217, 255, 0.15); 
            color: #00d9ff; 
            border-radius: 12px; 
        }
        
        .price-section { margin-bottom: 15px; }
        .current-price { font-size: 2.5rem; font-weight: bold; }
        .price-up { color: #00ff88; }
        .price-down { color: #ff4757; }
        
        .change { 
            font-size: 1rem; 
            padding: 5px 12px; 
            border-radius: 6px; 
            margin-top: 5px; 
            display: inline-block; 
        }
        .change-up { background: rgba(0, 255, 136, 0.15); color: #00ff88; }
        .change-down { background: rgba(255, 71, 87, 0.15); color: #ff4757; }
        
        /* 進場建議區塊 */
        .entry-section {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.15), rgba(255, 165, 0, 0.15));
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px solid rgba(255, 107, 107, 0.3);
        }
        
        .entry-title { 
            font-size: 1rem; 
            color: #ff6b6b; 
            margin-bottom: 10px; 
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .entry-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        
        .entry-item { 
            text-align: center; 
            padding: 10px; 
            background: rgba(0, 0, 0, 0.25); 
            border-radius: 8px; 
        }
        .entry-label { font-size: 0.7rem; color: #888; margin-bottom: 4px; }
        .entry-value { font-size: 1.1rem; font-weight: bold; }
        
        .entry-badge {
            display: block;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 8px;
            text-align: center;
        }
        
        .badge-buy { background: rgba(0, 255, 136, 0.25); color: #00ff88; }
        .badge-wait { background: rgba(255, 193, 7, 0.25); color: #ffc107; }
        .badge-sell { background: rgba(255, 71, 87, 0.25); color: #ff4757; }
        
        /* 合理股價 */
        .fair-price-section {
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.08), rgba(0, 255, 136, 0.08));
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(0, 217, 255, 0.2);
        }
        
        .fair-price-title { 
            font-size: 0.9rem; 
            color: #00d9ff; 
            margin-bottom: 10px; 
            font-weight: bold;
        }
        
        .fair-price-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        
        .fair-price-item { 
            text-align: center; 
            padding: 8px; 
            background: rgba(0, 0, 0, 0.2); 
            border-radius: 8px; 
        }
        .fair-label { font-size: 0.65rem; color: #888; margin-bottom: 4px; }
        .fair-value { font-size: 1rem; font-weight: bold; }
        
        .valuation-badge { 
            display: inline-block; 
            padding: 2px 6px; 
            border-radius: 4px; 
            font-size: 0.65rem; 
            font-weight: bold; 
            margin-top: 4px; 
        }
        .badge-overvalued { background: rgba(255, 71, 87, 0.25); color: #ff4757; }
        .badge-undervalued { background: rgba(0, 255, 136, 0.25); color: #00ff88; }
        
        .info-section { margin-top: 10px; }
        .info-row { 
            display: flex; 
            justify-content: space-between; 
            padding: 5px 0; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
        }
        .info-label { color: #888; font-size: 0.8rem; }
        .info-value { font-weight: bold; font-size: 0.8rem; }
        
        /* 連動 */
        .correlation-section { 
            margin-top: 10px; 
            padding: 10px; 
            background: rgba(0, 0, 0, 0.15); 
            border-radius: 8px; 
        }
        .correlation-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 8px; 
        }
        .correlation-title { font-size: 0.8rem; color: #00d9ff; }
        .correlation-badge { 
            font-size: 0.65rem; 
            padding: 3px 6px; 
            border-radius: 6px; 
            font-weight: bold; 
        }
        .badge-over { background: rgba(255, 71, 87, 0.25); color: #ff4757; }
        .badge-under { background: rgba(0, 217, 255, 0.25); color: #00d9ff; }
        .badge-normal { background: rgba(0, 255, 136, 0.25); color: #00ff88; }
        
        .correlation-data { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .correlation-item { text-align: center; flex: 1; }
        .correlation-label { font-size: 0.6rem; color: #888; }
        .correlation-value { font-size: 0.85rem; font-weight: bold; }
        
        .diff-bar { 
            height: 5px; 
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 3px; 
            position: relative; 
        }
        .diff-center { 
            position: absolute; 
            left: 50%; 
            top: 0; 
            width: 2px; 
            height: 100%; 
            background: rgba(255, 255, 255, 0.4); 
        }
        .diff-marker { 
            position: absolute; 
            top: -2px; 
            width: 10px; 
            height: 10px; 
            border-radius: 50%; 
            background: #fff; 
        }
        
        .loading { text-align: center; padding: 40px; color: #888; }
        
        @media (max-width: 900px) { 
            .stock-grid { grid-template-columns: 1fr; } 
            .fair-price-grid { grid-template-columns: 1fr; }
            .entry-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 台股個股分析儀表板</h1>
        
        <!-- 狀態列 -->
        <div class="status-bar">
            <div class="market-info">
                <div class="market-item">大盤: <span class="market-value" id="twii">載入中...</span></div>
                <div class="market-item">漲跌: <span class="market-value" id="twiiChange">--</span></div>
            </div>
            <div class="update-info">更新: <span id="updateTime">--</span></div>
            <div class="btn-group">
                <button class="update-btn" onclick="manualUpdate()" title="手動即時更新">⚡ 即時更新</button>
                <button class="refresh-btn" onclick="refreshData()">🔄 重新整理</button>
            </div>
        </div>
        
        <!-- 搜尋 -->
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="stockSearch" placeholder="輸入代號或名稱" onkeypress="handleSearch(event)">
            </div>
            <button class="search-btn" onclick="searchStock()">🔍</button>
        </div>
        
        <!-- 快速選擇 -->
        <div class="quick-stocks" id="quickStocks">
            <button class="quick-btn active" data-code="2330">2330 台積電</button>
            <button class="quick-btn" data-code="2317">2317 鴻海</button>
            <button class="quick-btn" data-code="2454">2454 聯發科</button>
            <button class="quick-btn" data-code="2382">2382 廣達</button>
            <button class="quick-btn" data-code="2308">2308 台達電</button>
            <button class="quick-btn" data-code="2474">2474 可成</button>
            <button class="quick-btn" data-code="3034">3034 聯詠</button>
            <button class="quick-btn" data-code="2357">2357 華碩</button>
            <button class="quick-btn" data-code="0050">0050 ETF</button>
            <button class="quick-btn" data-code="00878">00878 高股息</button>
        </div>
        
        <!-- 股票顯示區 -->
        <div class="stock-grid" id="stockContainer">
            <div class="loading">📡 載入資料中...</div>
        </div>
    </div>
    
    <script>
        let stockData = null;
        let selectedStocks = ['2330', '2317'];
        
        // 初始化
        async function init() {
            await loadData();
            
            document.querySelectorAll('.quick-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const code = btn.dataset.code;
                    if (selectedStocks.includes(code)) {
                        if (selectedStocks.length > 1) selectedStocks = selectedStocks.filter(s => s !== code);
                    } else {
                        if (selectedStocks.length >= 2) selectedStocks.shift();
                        selectedStocks.push(code);
                    }
                    document.querySelectorAll('.quick-btn').forEach(b => b.classList.toggle('active', selectedStocks.includes(b.dataset.code)));
                    renderStocks();
                });
            });
        }
        
        // 載入資料
        async function loadData() {
            try {
                const response = await fetch('database.json');
                stockData = await response.json();
                
                document.getElementById('twii').textContent = stockData.market.twii.toLocaleString();
                const twiiChange = stockData.market.changePercent;
                const twiiEl = document.getElementById('twiiChange');
                twiiEl.textContent = `${twiiChange > 0 ? '▲' : '▼'} ${twiiChange}%`;
                twiiEl.className = `market-value ${twiiChange >= 0 ? '' : 'down'}`;
                
                const updateTime = stockData.lastUpdate ? new Date(stockData.lastUpdate).toLocaleString('zh-TW') : new Date().toLocaleString('zh-TW');
                document.getElementById('updateTime').textContent = updateTime;
                
                renderStocks();
            } catch (error) {
                document.getElementById('stockContainer').innerHTML = `<div class="loading">❌ 載入失敗: ${error.message}</div>`;
            }
        }
        
        // 手動即時更新
        async function manualUpdate() {
            const btn = document.querySelector('.update-btn');
            btn.textContent = '⏳ 更新中...';
            btn.disabled = true;
            
            try {
                // 嘗試從Yahoo Finance抓取最新資料
                const stocks = ['2330', '2317', '2454', '2382', '2308', '0050'];
                
                for (let code of stocks) {
                    try {
                        const response = await fetch(`https://tw.stock.yahoo.com/quote/${code}.TW`);
                        const text = await response.text();
                        
                        // 解析股價
                        const priceMatch = text.match(/"price":{"regularMarketPrice":([0-9.]+)/);
                        const changeMatch = text.match(/"regularMarketChange":{"raw":([-\d.]+)/);
                        const changePercentMatch = text.match(/"regularMarketChangePercent":{"raw":([-\d.]+)/);
                        
                        if (priceMatch) {
                            const stock = stockData.stocks.find(s => s.code === code);
                            if (stock) {
                                stock.price = parseFloat(priceMatch[1]);
                                stock.change = changeMatch ? parseFloat(changeMatch[1]) : 0;
                                stock.changePercent = changePercentMatch ? parseFloat(changePercentMatch[1]) : 0;
                            }
                        }
                    } catch(e) { console.log(`更新 ${code} 失敗:`, e); }
                }
                
                // 更新時間
                stockData.lastUpdate = new Date().toISOString();
                document.getElementById('updateTime').textContent = new Date().toLocaleString('zh-TW');
                
                renderStocks();
                btn.textContent = '✓ 已更新';
            } catch (error) {
                btn.textContent = '✗ 更新失敗';
            }
            
            setTimeout(() => { 
                btn.disabled = false; 
                btn.textContent = '⚡ 即時更新'; 
            }, 3000);
        }
        
        // 渲染股票
        function renderStocks() {
            const container = document.getElementById('stockContainer');
            container.innerHTML = '';
            
            selectedStocks.forEach(code => {
                const stock = stockData.stocks.find(s => s.code === code);
                if (stock) container.innerHTML += createStockCard(stock);
            });
        }
        
        // 建立股票卡片（含進場建議）
        function createStockCard(stock) {
            const isUp = stock.change >= 0;
            const priceClass = isUp ? 'price-up' : 'price-down';
            const changeClass = isUp ? 'change-up' : 'change-down';
            const changeIcon = isUp ? '▲' : '▼';
            
            const sectorDiff = stock.changePercent - stock.sectorChange;
            let sectorStatus = '正常', sectorBadge = 'badge-normal', sectorPos = 50;
            if (sectorDiff > 1) { sectorStatus = '過高'; sectorBadge = 'badge-over'; sectorPos = 80; }
            else if (sectorDiff < -1) { sectorStatus = '過低'; sectorBadge = 'badge-under'; sectorPos = 20; }
            
            const marketDiff = stock.changePercent - stock.marketChange;
            let marketStatus = '正常', marketBadge = 'badge-normal', marketPos = 50;
            if (marketDiff > 1) { marketStatus = '過高'; marketBadge = 'badge-over'; marketPos = 80; }
            else if (marketDiff < -1) { marketStatus = '過低'; marketBadge = 'badge-under'; marketPos = 20; }
            
            // 計算進場建議
            const avgFair = (stock.fairPrice.per20 + stock.fairPrice.dividend3 + stock.fairPrice.growth) / 3;
            const priceDiff = ((stock.price - avgFair) / avgFair) * 100;
            const totalDiff = priceDiff + sectorDiff + marketDiff;
            
            let entryAdvice = '等待';
            let entryBadge = 'badge-wait';
            let entryColor = '#ffc107';
            
            if (totalDiff > 10) {
                entryAdvice = '暫時不買';
                entryBadge = 'badge-sell';
                entryColor = '#ff4757';
            } else if (totalDiff < -5) {
                entryAdvice = '可以考慮';
                entryBadge = 'badge-buy';
                entryColor = '#00ff88';
            } else if (totalDiff < 5 && totalDiff > -5) {
                entryAdvice = '合理價位';
                entryBadge = 'badge-wait';
                entryColor = '#ffc107';
            }
            
            // 計算建議進場價
            const suggestedPrice = Math.round(stock.price * (1 - (sectorDiff + marketDiff) / 200));
            
            return `
                <div class="stock-card">
                    <div class="stock-header">
                        <div class="stock-info">
                            <div class="stock-code">${stock.code}</div>
                            <div class="stock-name">${stock.name}</div>
                        </div>
                        <div class="sector-tag">${stock.sector}</div>
                    </div>
                    
                    <div class="price-section">
                        <div>
                            <div class="current-price ${priceClass}">${stock.price.toLocaleString()} 元</div>
                            <span class="change ${changeClass}">${changeIcon} ${stock.change} (${stock.changePercent}%)</span>
                        </div>
                    </div>
                    
                    <!-- 進場建議 -->
                    <div class="entry-section">
                        <div class="entry-title">🎯 進場建議</div>
                        <div class="entry-grid">
                            <div class="entry-item">
                                <div class="entry-label">現價</div>
                                <div class="entry-value ${priceClass}">${stock.price}</div>
                            </div>
                            <div class="entry-item">
                                <div class="entry-label">合理價</div>
                                <div class="entry-value">${avgFair.toFixed(0)}</div>
                            </div>
                            <div class="entry-item">
                                <div class="entry-label">建議進場</div>
                                <div class="entry-value" style="color:${entryColor}">${suggestedPrice}</div>
                            </div>
                        </div>
                        <div class="entry-badge ${entryBadge}">${entryAdvice}</div>
                    </div>
                    
                    <!-- 合理股價 -->
                    <div class="fair-price-section">
                        <div class="fair-price-title">💰 合理股價推算</div>
                        <div class="fair-price-grid">
                            <div class="fair-price-item">
                                <div class="fair-label">本益比20倍</div>
                                <div class="fair-value ${stock.fairPrice.per20 > stock.price ? 'price-down' : 'price-up'}">${stock.fairPrice.per20}</div>
                                <span class="valuation-badge ${stock.fairPrice.per20 > stock.price ? 'badge-undervalued' : 'badge-overvalued'}">${stock.fairPrice.per20 > stock.price ? '便宜' : '昂貴'}</span>
                            </div>
                            <div class="fair-price-item">
                                <div class="fair-label">股利折現</div>
                                <div class="fair-value ${stock.fairPrice.dividend3 > stock.price ? 'price-down' : 'price-up'}">${stock.fairPrice.dividend3}</div>
                                <span class="valuation-badge ${stock.fairPrice.dividend3 > stock.price ? 'badge-undervalued' : 'badge-overvalued'}">${stock.fairPrice.dividend3 > stock.price ? '便宜' : '昂貴'}</span>
                            </div>
                            <div class="fair-price-item">
                                <div class="fair-label">EPS成長</div>
                                <div class="fair-value ${stock.fairPrice.growth > stock.price ? 'price-down' : 'price-up'}">${stock.fairPrice.growth}</div>
                                <span class="valuation-badge ${stock.fairPrice.growth > stock.price ? 'badge-undervalued' : 'badge-overvalued'}">${stock.fairPrice.growth > stock.price ? '便宜' : '昂貴'}</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 基本資料 -->
                    <div class="info-section">
                        <div class="info-row"><span class="info-label">本益比</span><span class="info-value">${stock.pe}</span></div>
                        <div class="info-row"><span class="info-label">EPS</span><span class="info-value">${stock.eps} 元</span></div>
                        <div class="info-row"><span class="info-label">股利</span><span class="info-value">${stock.dividend} 元</span></div>
                    </div>
                    
                    <!-- 族群連動 -->
                    <div class="correlation-section">
                        <div class="correlation-header">
                            <span class="correlation-title">🔗 與族群連動</span>
                            <span class="correlation-badge ${sectorBadge}">${sectorStatus}</span>
                        </div>
                        <div class="correlation-data">
                            <div class="correlation-item"><div class="correlation-label">族群</div><div class="correlation-value ${stock.sectorChange >= 0 ? 'price-up' : 'price-down'}">${stock.sectorChange >= 0 ? '+' : ''}${stock.sectorChange}%</div></div>
                            <div class="correlation-item"><div class="correlation-label">個股</div><div class="correlation-value ${stock.changePercent >= 0 ? 'price-up' : 'price-down'}">${stock.changePercent >= 0 ? '+' : ''}${stock.changePercent}%</div></div>
                            <div class="correlation-item"><div class="correlation-label">差異</div><div class="correlation-value ${sectorDiff >= 0 ? 'price-up' : 'price-down'}">${sectorDiff >= 0 ? '+' : ''}${sectorDiff.toFixed(2)}%</div></div>
                        </div>
                        <div class="diff-bar"><div class="diff-center"></div><div class="diff-marker" style="left: ${sectorPos}%"></div></div>
                    </div>
                    
                    <!-- 大盤連動 -->
                    <div class="correlation-section">
                        <div class="correlation-header">
                            <span class="correlation-title">📉 與大盤連動</span>
                            <span class="correlation-badge ${marketBadge}">${marketStatus}</span>
                        </div>
                        <div class="correlation-data">
                            <div class="correlation-item"><div class="correlation-label">大盤</div><div class="correlation-value ${stock.marketChange >= 0 ? 'price-up' : 'price-down'}">${stock.marketChange >= 0 ? '+' : ''}${stock.marketChange}%</div></div>
                            <div class="correlation-item"><div class="correlation-label">個股</div><div class="correlation-value ${stock.changePercent >= 0 ? 'price-up' : 'price-down'}">${stock.changePercent >= 0 ? '+' : ''}${stock.changePercent}%</div></div>
                            <div class="correlation-item"><div class="correlation-label">差異</div><div class="correlation-value ${marketDiff >= 0 ? 'price-up' : 'price-down'}">${marketDiff >= 0 ? '+' : ''}${marketDiff.toFixed(2)}%</div></div>
                        </div>
                        <div class="diff-bar"><div class="diff-center"></div><div class="diff-marker" style="left: ${marketPos}%"></div></div>
                    </div>
                </div>
            `;
        }
        
        function handleSearch(event) { if (event.key === 'Enter') searchStock(); }
        
        function searchStock() {
            const input = document.getElementById('stockSearch').value.trim().toUpperCase();
            const nameToCode = {
                '台積電':'2330','台積':'2330','2330':'2330',
                '鴻海':'2317','2317':'2317',
                '聯發科':'2454','2454':'2454',
                '廣達':'2382','2382':'2382',
                '台達電':'2308','台達':'2308','2308':'2308',
                '統一':'1216','1216':'1216',
                '可成':'2474','2474':'2474',
                '聯詠':'3034','3034':'3034',
                '華碩':'2357','2357':'2357',
                '瑞昱':'2379','2379':'2379',
                '研華':'2395','2395':'2395',
                '中興電':'1605','1605':'1605',
                '元晶':'6443','6443':'6443',
                '元大台灣50':'0050','0050':'0050',
                '國泰永續高股息':'00878','00878':'00878'
            };
            
            let code = nameToCode[input] || input;
            const stock = stockData.stocks.find(s => s.code === code);
            
            if (stock) {
                if (!selectedStocks.includes(code)) {
                    if (selectedStocks.length >= 2) selectedStocks.shift();
                    selectedStocks.push(code);
                }
                document.querySelectorAll('.quick-btn').forEach(btn => btn.classList.toggle('active', selectedStocks.includes(btn.dataset.code)));
                renderStocks();
            } else {
                alert(`找不到股票 ${input}`);
            }
        }
        
        async function refreshData() {
            const btn = document.querySelector('.refresh-btn');
            btn.textContent = '更新中...';
            btn.disabled = true;
            try { 
                await loadData(); 
                btn.textContent = '✓ 已更新'; 
            }
            catch { btn.textContent = '✗ 失敗'; }
            setTimeout(() => { btn.disabled = false; btn.textContent = '🔄 重新整理'; }, 2000);
        }
        
        init();
    </script>
</body>
</html>
